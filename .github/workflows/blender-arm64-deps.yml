name: Build Blender Deps

on:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Blender
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          path: blender
          depth: 1
          ref: blender-v4.2-release

      - name: Install Host-side Packages
        run: |
          sudo dpkg --add-architecture armhf
          
          sudo apt-get update -qq
          
          # Fully strict LLVM toolkit along with necessary multilib system resources for AARCH64 LLVM/CLANG overrides
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends \
            build-essential cmake ccache git subversion curl xz-utils bzip2 patch \
            bison yasm tcl autoconf automake m4 meson python3-mako patchelf gettext autopoint \
            pkg-config ninja-build xutils-dev xsltproc xmlto python3-docutils \
            clang llvm lld libomp-dev \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libegl-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev linux-libc-dev libpulse-dev libasound2-dev libjack-dev libpipewire-0.3-dev \
            libtool libtool-bin autotools-dev uuid-dev libffi-dev \
            libgles-dev libgl1-mesa-dev libgl-dev libglu1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libinput-dev libevdev-dev libmtdev-dev libseat-dev \
            libvulkan-dev glslang-dev glslang-tools spirv-tools libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb-keysyms1-dev \
            libsystemd-dev libpam0g-dev libjpeg-dev libpng-dev libwebp-dev libcairo2-dev libpango1.0-dev xwayland \
            libxt-dev libsm-dev libice-dev libxaw7-dev libxpm-dev libepoxy-dev \
            libxml2-dev libtinyxml2-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev \
            libbz2-dev liblzma-dev zlib1g-dev libxrender-dev libxft-dev libx11-xcb-dev \
            libxcb-dri3-dev libxcb-present-dev libxshmfence-dev libclang-dev \
            libc6-dev-armhf-cross linux-libc-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Pre-Downloaded Missing Archives 
        run: |
          mkdir -p build_deps/packages

          [[ ! -f "build_deps/packages/glu-9.0.1.tar.xz" ]] && curl -L "https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz" -o build_deps/packages/glu-9.0.1.tar.xz
          [[ ! -f "build_deps/packages/mesa-23.3.0.tar.xz" ]] && curl -L "https://archive.mesa3d.org/mesa-23.3.0.tar.xz" -o build_deps/packages/mesa-23.3.0.tar.xz
          [[ ! -f "build_deps/packages/gmp-6.2.1.tar.xz" ]] && curl -L "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz" -o build_deps/packages/gmp-6.2.1.tar.xz
          exit 0 

      - name: Target Compatibility Patches
        run: |
          cd blender
          
          find build_files/cmake -type f -name "*.cmake" -exec sed -i -E 's|-fuse-ld=gold|-fuse-ld=lld|g' {} +
          
          find build_files/build_environment/cmake -name "*.cmake" -type f -exec sed -i -E \
            -e 's|\$\{SOURCE_DIR\}/configure |\$\{SOURCE_DIR\}/configure --build=aarch64-unknown-linux-gnu |g' \
            -e 's|\./configure |\./configure --build=aarch64-unknown-linux-gnu |g' \
            -e 's|-DCMAKE_C_COMPILER=.*dpcpp/bin/clang|-DCMAKE_C_COMPILER=clang|g' \
            -e 's|-DCMAKE_CXX_COMPILER=.*dpcpp/bin/clang++|-DCMAKE_CXX_COMPILER=clang++|g' \
            -e 's|-DCMAKE_C_COMPILER=.*dpcpp/bin/icx|-DCMAKE_C_COMPILER=clang|g' \
            -e 's|-DCMAKE_CXX_COMPILER=.*dpcpp/bin/icpx|-DCMAKE_CXX_COMPILER=clang++|g' \
            -e 's/-DEMBREE_SYCL_SUPPORT=ON/-DEMBREE_SYCL_SUPPORT=OFF/g' \
            -e 's/-DOIDN_DEVICE_SYCL=ON/-DOIDN_DEVICE_SYCL=OFF/g' \
            -e 's/-DOIDN_DEVICE_HIP=ON/-DOIDN_DEVICE_HIP=OFF/g' \
            -e 's/-DOIDN_DEVICE_CUDA=ON/-DOIDN_DEVICE_CUDA=OFF/g' \
            {} +
            
          f="build_files/build_environment/cmake/flex.cmake"
          [ -f "$f" ] && sed -i 's/--build=aarch64-unknown-linux-gnu/--build=aarch64-unknown-linux-gnu ac_cv_func_reallocarray=yes/g' "$f" || true
          
          f="build_files/build_environment/cmake/ispc.cmake"
          [ -f "$f" ] && sed -i '/CMAKE_ARGS/a\    -DX86_ENABLED=OFF\n    -DWEBASSEMBLY_ENABLED=OFF' "$f" || true
          
          f="build_files/build_environment/cmake/gmp.cmake"
          [ -f "$f" ] && sed -i 's/--disable-assembly/--disable-assembly --disable-fat/g' "$f" || true
          
          f="build_files/build_environment/cmake/gmmlib.cmake"
          [ -f "$f" ] && sed -i '/CMAKE_ARGS/a\    -DRUN_TEST_SUITE=OFF\n    -DRUN_ULT=OFF' "$f" || true
          
          sed -i 's/--prefix=/--build=aarch64-unknown-linux-gnu --prefix=/g' build_files/build_environment/cmake/theora.cmake || true
          sed -i 's/--prefix=/--build=aarch64-unknown-linux-gnu --prefix=/g' build_files/build_environment/cmake/vorbis.cmake || true
          
          opt="build_files/build_environment/cmake/options.cmake"
          
          if [ -f "$opt" ]; then
             echo 'set(PLATFORM_CFLAGS "${PLATFORM_CFLAGS} -fPIC -Wno-unknown-warning-option -Wno-implicit-function-declaration -Wno-error=implicit-function-declaration -Wno-int-conversion -Wno-error=int-conversion -Wno-incompatible-function-pointer-types -Wno-error=incompatible-function-pointer-types -Wno-implicit-int -Wno-error=implicit-int")' >> "$opt"
             echo 'set(PLATFORM_CXXFLAGS "${PLATFORM_CXXFLAGS} -fPIC -fpermissive -Wno-unknown-warning-option -Wno-changes-meaning -Wno-error=changes-meaning -Wno-error=enum-constexpr-conversion")' >> "$opt"
          fi
          
          for intel_gpu_only in ocloc igc intel_compute_runtime dpcpp level_zero sycl; do
             tgt="build_files/build_environment/cmake/${intel_gpu_only}.cmake"
             [ -f "$tgt" ] && echo "add_custom_target(external_${intel_gpu_only})" > "$tgt" || true
          done

      - name: Fetch CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-aarch64-blender-4.2-
          restore-keys: ccache-Linux-aarch64-blender-4.2
          max-size: 4G
          create-symlink: true

      - name: Build Blender Dependencies
        run: |
          mkdir -p bin
          
          cat << 'EOF' > bin/wrapper-stub.sh
          #!/bin/bash
          if [[ "$PWD" == *"sqlite"* ]] || [[ "$PWD" == *"glu"* ]] || [[ "$PWD" == *"libglu"* ]]; then
              exit 0
          else
              cmd="/usr/bin/$(basename $0)"
              if [ -x "$cmd" ]; then
                  exec "$cmd" "$@"
              else
                  echo "Missing original $(basename $0)!"
                  exit 127
              fi
          fi
          EOF
          chmod +x bin/wrapper-stub.sh
          
          for cmd in aclocal autoconf automake autoheader libtoolize autoreconf automake-1.15 aclocal-1.15 automake-1.16 aclocal-1.16 autom4te; do
            ln -sf wrapper-stub.sh "bin/$cmd"
          done
          
          cat << 'EOF' > bin/clang
          #!/bin/bash
          exec /usr/bin/clang -Qunused-arguments -Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-error=int-conversion -Wno-int-conversion -Wno-error=incompatible-function-pointer-types -Wno-incompatible-function-pointer-types -Wno-unknown-warning-option "$@"
          EOF
          chmod +x bin/clang

          cat << 'EOF' > bin/clang++
          #!/bin/bash
          exec /usr/bin/clang++ -Qunused-arguments -Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-error=int-conversion -Wno-int-conversion -Wno-error=incompatible-function-pointer-types -Wno-incompatible-function-pointer-types -Wno-error=enum-constexpr-conversion -Wno-changes-meaning -Wno-register -Wno-error=register -fpermissive -Wno-unknown-warning-option "$@"
          EOF
          chmod +x bin/clang++
          
          export PATH="$(pwd)/bin:/usr/lib/ccache:$PATH"
          export ARCH_LIBDIR="${{ github.workspace }}/lib/linux_aarch64"
          
          mkdir -p build_deps && cd build_deps
          mkdir -p "$ARCH_LIBDIR"
          
          export CC=clang
          export CXX=clang++
          
          export CXXFLAGS="-fPIC -Wno-changes-meaning -Wno-register -fpermissive -Wno-unknown-warning-option"
          export CFLAGS="-fPIC -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-function-pointer-types -Wno-unknown-warning-option -Wno-error=implicit-function-declaration"
          
          export ISPC_EXTRA_ARGS="--target=neon --arch=aarch64"
          
          cmake ../blender/build_files/build_environment \
            -DHARVEST_TARGET="$ARCH_LIBDIR" \
            -DCMAKE_INSTALL_PREFIX="$ARCH_LIBDIR" \
            -DBUILD_DIR="$ARCH_LIBDIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_AR=$(which llvm-ar) \
            -DCMAKE_RANLIB=$(which llvm-ranlib) \
            -DCMAKE_LINKER=$(which lld) \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SYCL=OFF
            
          make -j$(nproc)
          
          if [ -d "Release" ] && [ "$(ls -A Release 2>/dev/null)" ]; then
             cp -ra Release/* "$ARCH_LIBDIR/" || true
          fi

      - name: Upload Blender Dependencies Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-deps
          path: ${{ github.workspace }}/lib/linux_aarch64
