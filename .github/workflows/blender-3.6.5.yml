name: Blender 3.6.23 aarch64
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y git cmake build-essential ninja-build wget
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt install -y autoconf automake bison libtool yasm tcl meson python3-mako patchelf

      - name: BBlender source
        run: |
          git clone --depth 1 -b v3.6.23 https://github.com/blender/blender.git
          cd blender
          git submodule update --init --depth 1 --recursive

          - name: Download and build prebuilt deps for aarch64
            run: |
              cd blender
              mkdir -p build_linux/deps/packages
              wget -O build_linux/deps/packages/glu-9.0.1.tar.xz https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz
              
              export BLENDER_DOWNLOAD_TIMEOUT=600
              for i in 1 2; do
                echo "make deps attempt $i"
                make deps && break || sleep 30
              done
      - name: Configure CMake
        run: |
          cd blender
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_CYCLES_CUDA=OFF -DWITH_CYCLES_OPTIX=OFF -DWITH_CYCLES_HIP=OFF -DWITH_CYCLES_METAL=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_XR_OPENXR=OFF \
            -DWITH_CODEC_FFMPEG=ON \
            -DWITH_USD=OFF -DWITH_OPENCOLLADA=OFF -DWITH_ALEMBIC=OFF \
            -DWITH_OPENSUBDIV=OFF -DWITH_OPENVDB=OFF \
            -DWITH_POTRACE=OFF -DWITH_JACK=OFF -DWITH_PULSEAUDIO=OFF \
            -DWITH_LIBS_PRECOMPILED=ON
      - name: Build
        run: |
          cd blender/build
          ninja -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender
