name: Build Blender 3.6.5 aarch64
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cross toolchain
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential ninja-build wget
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Download Blender with libs 3.6.0
        run: |
          wget https://ftp.nluug.nl/pub/graphics/blender/source/blender-with-libraries-3.6.0.tar.xz
          tar -xf blender-with-libraries-3.6.0.tar.xz
          mv blender-3.6.0 blender

      - name: Configure CMake
        run: |
          cd blender
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=../lib/linux_aarch64 \
            -DWITH_LIBS_PRECOMPILED=ON \
            -DWITH_CYCLES_CUDA=OFF -DWITH_CYCLES_OPTIX=OFF \
            -DWITH_OPENCOLLADA=OFF \
            -DWITH_POTRACE=OFF \
            -DWITH_OPENJPEG=OFF

      - name: Build
        run: |
          cd blender/build
          ninja -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-3.6.0-aarch64
          path: blender/build/bin/blender
          retention-days: 30
