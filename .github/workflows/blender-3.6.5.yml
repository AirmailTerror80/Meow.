name: Blender 3.6.23 aarch64
on: [workflow_dispatch]

env:
  BLENDER_BRANCH: blender-v3.6-release
  BLENDER_VERSION: 3.6.23

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup qemu
        uses: docker/setup-qemu-action@v3

      - name: Arm64 ubuntu container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e BLENDER_BRANCH="${BLENDER_BRANCH}" \
            -e BLENDER_VERSION="${BLENDER_VERSION}" \
            ubuntu:22.04 bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y git wget curl build-essential cmake ninja-build subversion \
              autoconf automake bison libtool yasm tcl ninja-build meson python3-mako patchelf \
              libasound2-dev libopenal-dev libpulse-dev libjack-jackd2-dev \
              libx11-dev libxext-dev libxi-dev libxrandr-dev libxfixes-dev \
              libxxf86vm-dev libxcursor-dev libgl1-mesa-dev libglu1-mesa-dev \
              libglew-dev libjpeg-dev libpng-dev libtiff-dev libopenexr-dev \
              libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
              libavfilter-dev libavdevice-dev libswresample-dev \
              libfftw3-dev libgmp-dev libopenblas-dev libtbb-dev \
              zlib1g-dev libzstd-dev liblzma-dev libbz2-dev \
              libssl-dev libfreetype6-dev libfontconfig1-dev \
              libsndfile1-dev libjemalloc-dev libcairo2-dev libglfw3-dev \
              libboost-all-dev wayland-protocols libwayland-dev libxkbcommon-dev python3-dev

              echo 'Cloning blender'
              git clone --depth 1 -b \"\${BLENDER_BRANCH}\" https://github.com/blender/blender.git blender
              cd blender
              git submodule update --init --recursive --depth 1
              git clone --depth 1 https://projects.blender.org/blender/blender-addons.git scripts/addons

              echo 'Building Dldependencies'
              mkdir -p ../build_linux/deps/packages
              
              wget -q -O ../build_linux/deps/packages/mesa-21.1.5.tar.xz https://archive.mesa3d.org/older-versions/21.x/mesa-21.1.5.tar.xz
              wget -q -O ../build_linux/deps/packages/glu-9.0.1.tar.xz https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz
              
              wget -q -O ../build_linux/deps/packages/gmp-6.2.1.tar.xz https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz
              
              export BLENDER_DOWNLOAD_TIMEOUT=600
              make deps -j\$(nproc)

              echo 'Configuring cmake'
              mkdir -p build && cd build
              cmake .. -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_LIBS_PRECOMPILED=OFF \
                -DLIBDIR=../lib/linux_aarch64 \
                -DWITH_CYCLES_CUDA=OFF -DWITH_CYCLES_OPTIX=OFF \
                -DWITH_CYCLES_HIP=OFF -DWITH_CYCLES_METAL=OFF \
                -DWITH_OPENIMAGEDENOISE=OFF -DWITH_XR_OPENXR=OFF \
                -DWITH_USD=OFF -DWITH_OPENCOLLADA=OFF -DWITH_ALEMBIC=OFF \
                -DWITH_OPENSUBDIV=OFF -DWITH_OPENVDB=OFF \
                -DWITH_POTRACE=OFF -DWITH_JACK=OFF -DWITH_PULSEAUDIO=OFF \
                -DWITH_CODEC_FFMPEG=ON -DWITH_INSTALL_PORTABLE=ON

              echo 'Building blender'
              ninja -j\$(nproc)
              ninja install

              cp -r bin /workspace/blender-portable
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-3.6.23-aarch64
          path: blender-portable/
          retention-days: 10
