name: Blender 3.6.23 aarch64 system-deps
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Enable multiarch and install system deps
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt update
          sudo apt install -y git cmake build-essential ninja-build wget
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          sudo apt install -y libjpeg-dev:arm64 libpng-dev:arm64 zlib1g-dev:arm64 libopenjpeg-dev:arm64 libtiff-dev:arm64
          sudo apt install -y libfreetype-dev:arm64 libopenexr-dev:arm64 libboost-dev:arm64 libfftw3-dev:arm64
          sudo apt install -y libsqlite3-dev:arm64 liblzma-dev:arm64 libbz2-dev:arm64 libzstd-dev:arm64
          sudo apt install -y libpython3-dev:arm64 libxi-dev:arm64 libx11-dev:arm64 libxxf86vm-dev:arm64
          sudo apt install -y libxcursor-dev:arm64 libxinerama-dev:arm64 libxrandr-dev:arm64 libglew-dev:arm64
          # ffmpeg is the big one
          sudo apt install -y libavcodec-dev:arm64 libavformat-dev:arm64 libavutil-dev:arm64 libswscale-dev:arm64 libswresample-dev:arm64

      - name: Blender source
        run: |
          git clone --depth 1 -b blender-v3.6-release https://github.com/blender/blender.git
          cd blender
          git submodule update --init --depth 1 --recursive
          git clone --depth 1 https://projects.blender.org/blender/blender-addons.git scripts/addons

      - name: Configure CMake
        run: |
          cd blender
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_CYCLES_CUDA=OFF -DWITH_CYCLES_OPTIX=OFF -DWITH_CYCLES_HIP=OFF -DWITH_CYCLES_METAL=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_XR_OPENXR=OFF \
            -DWITH_CODEC_FFMPEG=ON \
            -DWITH_USD=OFF -DWITH_OPENCOLLADA=OFF -DWITH_ALEMBIC=OFF \
            -DWITH_OPENSUBDIV=OFF -DWITH_OPENVDB=OFF \
            -DWITH_POTRACE=OFF -DWITH_JACK=OFF -DWITH_PULSEAUDIO=OFF \
            -DWITH_LIBS_PRECOMPILED=OFF

      - name: Build
        run: |
          cd blender/build
          ninja -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-3.6.23-aarch64
          path: blender/build/bin/blender
          retention-days: 10
