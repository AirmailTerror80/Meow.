name: Blender 3.6.5 aarch64
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ~/.ccache
      CCACHE_MAXSIZE: 5G
    steps:
      - name: Install deps cross and toolchain
        run: |
          sudo apt update
          sudo apt install -y git cmake build-essential ccache ninja-build wget
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: blender-3.6.5-aarch64-${{ github.run_id }}
          restore-keys: |
            blender-3.6.5-aarch64-

      - name: Blender Source shallow
        run: |
          git clone --depth 1 -b v3.6.5 https://github.com/blender/blender.git
          cd blender
          git submodule update --init --depth 1 --recursive

      - name: Download prebuilt deps for aarch64
        run: |
          cd blender
          make deps

      - name: Configure CMake
        run: |
          cd blender
          mkdir build && cd build
          cmake .. -G Ninja \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_CYCLES_CUDA=OFF -DWITH_CYCLES_OPTIX=OFF \
            -DWITH_OPENVDB=ON -DWITH_OPENCOLLADA=OFF \
            -DWITH_AUDASPACE=ON \
            -DWITH_POTRACE=OFF

      - name: Build
        run: |
          cd blender/build
          ccache -z
          ninja -j$(nproc)
          ccache -s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-3.6.5-aarch64
          path: blender/build/bin/blender
          retention-days: 30