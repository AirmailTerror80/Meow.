name: Build Blender Binary

on:
  workflow_dispatch:
    
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    
    steps:
      - name: Install Host-side Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git ccache clang lld \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxxf86vm-dev libxfixes-dev libegl-dev wayland-protocols libpulse-dev \
            libwayland-dev libxkbcommon-dev libdbus-1-dev curl unzip libomp-dev
        
      - name: Checkout Blender
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          path: blender
          ref: blender-v4.2-release
          fetch-depth: 1
          submodules: true

      - name: Fetch LFS
        run: |
          cd blender
          git config lfs.url "https://projects.blender.org/blender/blender.git/info/lfs"
          git lfs pull
          
      - name: Fetch Dependencies
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: AirmailTerror80/Meow.
          run_id: 36942719950
          path: deps-cache/

      - name: Unpack Dependencies
        run: |
          export ARCH_LIBDIR="${{ github.workspace }}/lib/linux_aarch64"
          mkdir -p $ARCH_LIBDIR
          
          mv deps-cache/*/* $ARCH_LIBDIR/ || true
          
          find "$ARCH_LIBDIR" -type f \( -path "*/bin/*" -o -name "*.so*" -o -name "*.sh" \) -exec chmod +x {} +
          
          ls -lha $ARCH_LIBDIR/ 
          
      - name: Build Blender
        run: |
          export ARCH_LIBDIR="${{ github.workspace }}/lib/linux_aarch64"
          mkdir -p build_blender && cd build_blender
          export PATH="/usr/lib/ccache:$PATH"
          
          export CPLUS_INCLUDE_PATH="$ARCH_LIBDIR/imath/include:$ARCH_LIBDIR/openexr/include:$ARCH_LIBDIR/openimageio/include"
          export C_INCLUDE_PATH="$ARCH_LIBDIR/imath/include:$ARCH_LIBDIR/openexr/include:$ARCH_LIBDIR/openimageio/include"
          
          find "$ARCH_LIBDIR" -name "*.pc" | while read -r pc_file; do
            PKG_DIR=$(dirname $(dirname $(dirname "$pc_file")))
            sed -i -E "s|^prefix=.*|prefix=$PKG_DIR|g" "$pc_file"
          done
          
          export PKG_CONFIG_PATH="$(find "$ARCH_LIBDIR" -type d -name 'pkgconfig' -exec printf '%s:' {} +)$PKG_CONFIG_PATH"
          export CMAKE_PREFIX_PATH="$ARCH_LIBDIR;$(find "$ARCH_LIBDIR" -mindepth 1 -maxdepth 1 -type d -exec printf '%s;' {} +)"
          
          FREETYPE_STATIC_LIB="$ARCH_LIBDIR/freetype/lib/libfreetype2ST.a"
          
          EXTRA_LIBS="-fopenmp $ARCH_LIBDIR/usd/lib/libusd_ms.so $ARCH_LIBDIR/x265/lib/libx265.a $ARCH_LIBDIR/x264/lib/libx264.a $ARCH_LIBDIR/aom/lib/libaom.a $ARCH_LIBDIR/vpx/lib/libvpx.a $ARCH_LIBDIR/tiff/lib/libtiff.a $ARCH_LIBDIR/deflate/lib/libdeflate.a"
          
          cmake ../blender \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--undefined-version" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--undefined-version" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld -Wl,--undefined-version" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="$EXTRA_LIBS" \
            -DCMAKE_C_STANDARD_LIBRARIES="$EXTRA_LIBS" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLIBDIR="$ARCH_LIBDIR" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DPYTHON_VERSION=3.11 \
            -DPYTHON_ROOT_DIR="$ARCH_LIBDIR/python" \
            -DFreetype_ROOT="$ARCH_LIBDIR/freetype" \
            -DFREETYPE_LIBRARY="$FREETYPE_STATIC_LIB" \
            -DFREETYPE_LIBRARY_RELEASE="$FREETYPE_STATIC_LIB" \
            -DOPENEXR_INCLUDE_DIR="$ARCH_LIBDIR/openexr/include" \
            -DIMATH_INCLUDE_DIR="$ARCH_LIBDIR/imath/include" \
            -DOPENIMAGEIO_INCLUDE_DIR="$ARCH_LIBDIR/openimageio/include" \
            -DWITH_PULSEAUDIO=ON \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_GHOST_WAYLAND=ON \
            -DWITH_VULKAN_BACKEND=ON \
            -DWITH_PYTHON_INSTALL=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_DEVICE_CUDA=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF \
            -DWITH_CYCLES_DEVICE_SYCL=OFF \
            -DWITH_CYCLES_DEVICE_ONEAPI=OFF \
            -DWITH_CYCLES_DEVICE_METAL=OFF
         
          export LD_LIBRARY_PATH="$(find "$ARCH_LIBDIR" -mindepth 2 -maxdepth 2 -type d -name lib -exec printf '%s:' {} +)$LD_LIBRARY_PATH"
          
          make -j$(nproc)
          make install
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2-aarch64-binary
          path: build_blender/bin/
          if-no-files-found: error
