name: Build Blender 4.2.23 LTS (aarch64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blender 4.2.23 LTS
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: v4.2.23
          path: blender
          submodules: recursive

      - name: Install Toolchain & Standard Sysroot
        run: |
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y clang llvm lld cmake git make subversion patch curl tar xz-utils bzip2 rsync
          
          # Re-enable the foundational Ubuntu libc/libstdc++ base cross-compiler environment
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            $SUDO apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross \
            build-essential git git-lfs subversion cmake autoconf automake bison libtool yasm tcl ninja-build meson python3-mako patchelf
          fi

      - name: Fetch Custom Sysroot & Link Missing GCC Libs
        run: |
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          ARCH=$(uname -m)
          
          if [ "$ARCH" = "x86_64" ]; then
            $SUDO mkdir -p /opt/arm64-sysroot
            
            # Fetch Custom Sysroot dynamically from your GitHub Release
            SYSROOT_URL=$(curl -s "https://api.github.com/repos/AirmailTerror80/Meow./releases/tags/arm64-sysroot" | grep "browser_download_url" | head -n 1 | cut -d '"' -f 4)
            $SUDO curl -L "$SYSROOT_URL" -o /opt/sysroot_archive
            $SUDO tar -xf /opt/sysroot_archive -C /opt/arm64-sysroot
            
            if [ -d "/opt/arm64-sysroot/sysroot" ]; then
              $SUDO cp -r /opt/arm64-sysroot/sysroot/* /opt/arm64-sysroot/
              $SUDO rm -rf /opt/arm64-sysroot/sysroot
            fi
            
            echo "Merging Custom Sysroot into /usr/aarch64-linux-gnu..."
            $SUDO rsync -a /opt/arm64-sysroot/usr/include/ /usr/aarch64-linux-gnu/include/ || true
            if [ -d "/opt/arm64-sysroot/usr/lib/aarch64-linux-gnu" ]; then
              $SUDO rsync -a /opt/arm64-sysroot/usr/lib/aarch64-linux-gnu/ /usr/aarch64-linux-gnu/lib/ || true
            fi
            $SUDO rsync -a --ignore-existing /opt/arm64-sysroot/usr/lib/ /usr/aarch64-linux-gnu/lib/ || true
            $SUDO rsync -a --ignore-existing /opt/arm64-sysroot/lib/ /usr/aarch64-linux-gnu/lib/ || true
            
            echo "Injecting GCC toolchain standard libraries..."
            for ext in "*.so*" "*.a" "*.o"; do
              $SUDO find /usr/lib/gcc-cross/aarch64-linux-gnu -type f -name "$ext" -exec cp -L {} /usr/aarch64-linux-gnu/lib/ \; || true
              $SUDO find /usr/lib/gcc-cross/aarch64-linux-gnu -type l -name "$ext" -exec cp -L {} /usr/aarch64-linux-gnu/lib/ \; || true
            done
            
            echo "Patching cross-sysroot linker scripts..."
            $SUDO find /usr/aarch64-linux-gnu/lib -name "*.so" -type f -exec grep -l "GROUP" {} + | \
            xargs -r $SUDO sed -i 's|/usr/lib/aarch64-linux-gnu/||g; s|/lib/aarch64-linux-gnu/||g; s| /usr/lib/| |g; s|(/usr/lib/|(|g; s| /lib/| |g; s|(/lib/|(|g'
            
            $SUDO mkdir -p /usr/aarch64-linux-gnu/usr/lib
            $SUDO ln -snf /usr/aarch64-linux-gnu/lib /usr/aarch64-linux-gnu/usr/lib/aarch64-linux-gnu
            $SUDO ln -snf /usr/aarch64-linux-gnu/lib /usr/aarch64-linux-gnu/usr/aarch64-linux-gnu
          fi

      - name: Pre-download Dead FTP Dependencies
        run: |
          mkdir -p build_deps/packages
          curl -L "https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz" -o build_deps/packages/glu-9.0.1.tar.xz
          curl -L "https://archive.mesa3d.org/mesa-23.3.0.tar.xz" -o build_deps/packages/mesa-23.3.0.tar.xz
          curl -L "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz" -o build_deps/packages/gmp-6.2.1.tar.xz

      - name: Patch Source Code for Cross-Compilation
        run: |
          ARCH=$(uname -m)
          
          if [ "$ARCH" = "x86_64" ]; then
            # FIX: Force OpenSSL to cross-compile for aarch64 and inject the compiler flags directly into the Configure line
            sed -i 's|\./config|\./Configure linux-aarch64 --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu|g' blender/build_files/build_environment/cmake/ssl.cmake
          fi
          
          sed -i 's/-DALSOFT_REQUIRE_PULSEAUDIO=ON/-DALSOFT_REQUIRE_PULSEAUDIO=OFF/g' blender/build_files/build_environment/cmake/openal.cmake || true
          sed -i 's/-DALSOFT_REQUIRE_PIPEWIRE=ON/-DALSOFT_REQUIRE_PIPEWIRE=OFF/g' blender/build_files/build_environment/cmake/openal.cmake || true

      - name: Cross-build Standard Dependencies (No Heavy VFX features)
        run: |
          ARCH=$(uname -m)
          DEPS_FLAGS="-DCMAKE_C_COMPILER=clang \
                      -DCMAKE_CXX_COMPILER=clang++ \
                      -DCMAKE_AR=llvm-ar \
                      -DCMAKE_RANLIB=llvm-ranlib \
                      -DCMAKE_LINKER=ld.lld \
                      -DBUILD_OPENVDB=OFF \
                      -DBUILD_EMBREE=OFF \
                      -DBUILD_OSL=OFF \
                      -DBUILD_OIDN=OFF \
                      -DBUILD_USD=OFF \
                      -DBUILD_ALEMBIC=OFF \
                      -DBUILD_MATERIALX=OFF"
          
          if [ "$ARCH" = "x86_64" ]; then
            export PKG_CONFIG_DIR=
            export PKG_CONFIG_LIBDIR=/usr/aarch64-linux-gnu/lib/pkgconfig:/usr/aarch64-linux-gnu/share/pkgconfig
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
            
            # FIX: Ensure stubborn dependency Makefiles globally inherit cross-compilation targets
            export CFLAGS="--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu"
            export CXXFLAGS="--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu"
            export LDFLAGS="--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu -fuse-ld=lld"
            
            DEPS_FLAGS="$DEPS_FLAGS \
                        -DCMAKE_SYSTEM_NAME=Linux \
                        -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                        -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
                        -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
                        -DCMAKE_SYSROOT=/usr/aarch64-linux-gnu \
                        -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
                        -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
                        -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld"
          fi
          
          mkdir -p build_deps && cd build_deps
          cmake ../blender/build_files/build_environment $DEPS_FLAGS
          make -j$(nproc)

      - name: Cross-build Blender (aarch64, X11 enabled)
        run: |
          ARCH=$(uname -m)
          CMAKE_FLAGS="-DCMAKE_SYSTEM_NAME=Linux \
                       -DCMAKE_C_COMPILER=clang \
                       -DCMAKE_CXX_COMPILER=clang++ \
                       -DCMAKE_AR=llvm-ar \
                       -DCMAKE_RANLIB=llvm-ranlib \
                       -DCMAKE_LINKER=ld.lld \
                       -DCMAKE_PREFIX_PATH=../build_deps/opt \
                       -DWITH_CYCLES=ON \
                       -DWITH_CYCLES_DEVICE_CUDA=OFF \
                       -DWITH_CYCLES_DEVICE_OPTIX=OFF \
                       -DWITH_CYCLES_DEVICE_HIP=OFF \
                       -DWITH_CYCLES_DEVICE_SYCL=OFF \
                       -DWITH_CYCLES_EMBREE=OFF \
                       -DWITH_CYCLES_OSL=OFF \
                       -DWITH_OPENVDB=OFF \
                       -DWITH_NANOVDB=OFF \
                       -DWITH_OPENIMAGEDENOISE=OFF \
                       -DWITH_USD=OFF \
                       -DWITH_ALEMBIC=OFF \
                       -DWITH_MATERIALX=OFF"
          
          if [ "$ARCH" = "x86_64" ]; then
            export PKG_CONFIG_DIR=
            export PKG_CONFIG_LIBDIR=/usr/aarch64-linux-gnu/lib/pkgconfig:/usr/aarch64-linux-gnu/share/pkgconfig
            export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
            
            export CFLAGS="--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu"
            export CXXFLAGS="--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu"
            export LDFLAGS="--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu -fuse-ld=lld"
            
            CMAKE_FLAGS="$CMAKE_FLAGS \
                         -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                         -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
                         -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
                         -DCMAKE_SYSROOT=/usr/aarch64-linux-gnu \
                         -DCMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu \
                         -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
                         -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
                         -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
                         -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
                         -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
                         -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
                         -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld"
          fi
          
          mkdir -p build_blender && cd build_blender
          cmake ../blender $CMAKE_FLAGS
          make -j$(nproc)

      - name: Upload Compiled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64
          path: build_blender/bin/
