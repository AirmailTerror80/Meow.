name: Build Blender 4.2.23 LTS Deps (aarch64)
on: [workflow_dispatch]

env:
  BLENDER_BRANCH: v4.2.23
  BLENDER_VERSION: 4.2.23
  SYSROOT_URL: "https://github.com/AirmailTerror80/Meow./releases/download/arm64-sysroot/arm64-sysroot.tar.gz"
  QEMU_LD_PREFIX: /opt/sysroot

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: v4.2.23
          path: blender
          submodules: recursive

      - name: Install Host tools & GCC Cross-Compiler
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config curl \
            qemu-user-static binfmt-support patch xz-utils bzip2 \
            autoconf automake bison libtool yasm tcl meson python3-mako patchelf

      - name: Setup Compiler Cache (ccache)
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache-blender-deps-4.2-arm
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 2G

      - name: Fetch and Extract ARM64 Sysroot
        run: |
          echo "Creating sysroot target directory"
          sudo mkdir -p /opt/sysroot

          echo "Downloading sysroot tarball"
          curl -sSL -o sysroot.tar.gz "${SYSROOT_URL}"

          echo "Extracting Gzip sysroot"
          sudo tar -xzf sysroot.tar.gz -C /opt/sysroot

      - name: Checkout Blender Source
        run: |
          git clone --depth 1 -b "${BLENDER_BRANCH}" https://github.com/blender/blender.git blender
          cd blender
          git submodule update --init --recursive --depth 1

      - name: Pre-download Dead FTP Dependencies
        run: |
          mkdir -p build_deps/packages
          curl -L "https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz" -o build_deps/packages/glu-9.0.1.tar.xz
          curl -L "https://archive.mesa3d.org/mesa-23.3.0.tar.xz" -o build_deps/packages/mesa-23.3.0.tar.xz
          curl -L "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz" -o build_deps/packages/gmp-6.2.1.tar.xz

      - name: Patch Stubborn Dependency Scripts (OpenSSL & OpenAL)
        run: |
          cd blender
          
          # 1. Force OpenSSL to explicitly cross-compile (using --cross-compile-prefix flag safely)
          sed -i 's|\./config|\./Configure linux-aarch64 --cross-compile-prefix=aarch64-linux-gnu-|g' build_files/build_environment/cmake/ssl.cmake
          
      - name: Configure CMake for Cross-Dependencies
        run: |
          export CFLAGS="--sysroot=/opt/sysroot"
          export CXXFLAGS="--sysroot=/opt/sysroot"
          export LDFLAGS="--sysroot=/opt/sysroot"
          
          export PKG_CONFIG_SYSROOT_DIR=/opt/sysroot
          export PKG_CONFIG_PATH=/opt/sysroot/usr/lib/aarch64-linux-gnu/pkgconfig:/opt/sysroot/usr/share/pkgconfig

          mkdir -p build_deps
          cd build_deps

          cmake ../blender/build_files/build_environment -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_SYSROOT=/opt/sysroot \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_FIND_ROOT_PATH="/opt/sysroot" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DBUILD_OPENVDB=OFF \
            -DBUILD_EMBREE=OFF \
            -DBUILD_OSL=OFF \
            -DBUILD_OIDN=OFF \
            -DBUILD_USD=OFF \
            -DBUILD_ALEMBIC=OFF \
            -DBUILD_MATERIALX=OFF

      - name: Build Cross-Compiled Dependencies
        run: |
          cd build_deps
          # Run ninja cleanly (no exported overrides required!)
          ninja -j$(nproc)

      - name: Upload Dependency Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-deps-aarch64
          path: build_deps/linux_*
