name: Build Blender 4.2.23 LTS (aarch64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Blender 4.2.23 LTS
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: v4.2.23
          path: blender
          submodules: recursive

      - name: Install Toolchain (LLVM sysroot & tools)
        run: |
          SUDO=""
          if command -v sudo >/dev/null 2>&1; then SUDO="sudo"; fi
          $SUDO apt-get update
          $SUDO apt-get install -y clang llvm lld cmake git make subversion patch curl tar xz-utils bzip2
          
          # Install GCC cross toolchain & sysroot (if host is x86_64 GH Runner)
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            $SUDO apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross
            
            # FIX: Debian multiarch/cross packages embed host absolute paths in libc.so
            # By symlinking the duplicated sysroot path to itself, ld.lld correctly locates libc.so.6
            $SUDO mkdir -p /usr/aarch64-linux-gnu/usr/aarch64-linux-gnu
            $SUDO ln -snf /usr/aarch64-linux-gnu/lib /usr/aarch64-linux-gnu/usr/aarch64-linux-gnu/lib
            $SUDO ln -snf /usr/aarch64-linux-gnu/include /usr/aarch64-linux-gnu/usr/aarch64-linux-gnu/include
          fi

      - name: Cross-build Standard Dependencies (No Heavy Desktop/VFX features)
        run: |
          ARCH=$(uname -m)
          DEPS_FLAGS="-DCMAKE_C_COMPILER=clang \
                      -DCMAKE_CXX_COMPILER=clang++ \
                      -DCMAKE_AR=llvm-ar \
                      -DCMAKE_RANLIB=llvm-ranlib \
                      -DCMAKE_LINKER=ld.lld \
                      -DBUILD_OPENVDB=OFF \
                      -DBUILD_EMBREE=OFF \
                      -DBUILD_OSL=OFF \
                      -DBUILD_OIDN=OFF \
                      -DBUILD_USD=OFF \
                      -DBUILD_ALEMBIC=OFF \
                      -DBUILD_MATERIALX=OFF"
          
          if [ "$ARCH" = "x86_64" ]; then
            DEPS_FLAGS="$DEPS_FLAGS \
                        -DCMAKE_SYSTEM_NAME=Linux \
                        -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                        -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
                        -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
                        -DCMAKE_SYSROOT=/usr/aarch64-linux-gnu \
                        -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
                        -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
                        -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld"
          fi
          
          mkdir -p build_deps && cd build_deps
          cmake ../blender/build_files/build_environment $DEPS_FLAGS
          make -j$(nproc)

      - name: Cross-build Blender (aarch64)
        run: |
          ARCH=$(uname -m)
          CMAKE_FLAGS="-DCMAKE_SYSTEM_NAME=Linux \
                       -DCMAKE_C_COMPILER=clang \
                       -DCMAKE_CXX_COMPILER=clang++ \
                       -DCMAKE_AR=llvm-ar \
                       -DCMAKE_RANLIB=llvm-ranlib \
                       -DCMAKE_LINKER=ld.lld \
                       -DCMAKE_PREFIX_PATH=../build_deps/opt \
                       -DWITH_CYCLES=ON \
                       -DWITH_CYCLES_DEVICE_CUDA=OFF \
                       -DWITH_CYCLES_DEVICE_OPTIX=OFF \
                       -DWITH_CYCLES_DEVICE_HIP=OFF \
                       -DWITH_CYCLES_DEVICE_SYCL=OFF \
                       -DWITH_CYCLES_EMBREE=OFF \
                       -DWITH_CYCLES_OSL=OFF \
                       -DWITH_OPENVDB=OFF \
                       -DWITH_NANOVDB=OFF \
                       -DWITH_OPENIMAGEDENOISE=OFF \
                       -DWITH_USD=OFF \
                       -DWITH_ALEMBIC=OFF \
                       -DWITH_MATERIALX=OFF"
          
          if [ "$ARCH" = "x86_64" ]; then
            CMAKE_FLAGS="$CMAKE_FLAGS \
                         -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                         -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
                         -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
                         -DCMAKE_SYSROOT=/usr/aarch64-linux-gnu \
                         -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
                         -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld \
                         -DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld"
          fi
          
          mkdir -p build_blender && cd build_blender
          cmake ../blender $CMAKE_FLAGS
          make -j$(nproc)

      - name: Upload Compiled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64
          path: build_blender/bin/
