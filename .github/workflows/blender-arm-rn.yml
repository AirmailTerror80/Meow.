name: Build Blender 4.2 LTS

on:
  workflow_dispatch:

env:
  BLENDER_BRANCH: blender-v4.2-release

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Blender Checkout
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs 
          git lfs install
          
          git clone --branch ${{ env.BLENDER_BRANCH }} --depth 1 https://projects.blender.org/blender/blender.git blender
          
          cd blender
          git submodule update --init --recursive
          
      - name: Install Host-side Packages & Cross Packages For ISPC
        run: |
          sudo dpkg --add-architecture armhf
          
          sudo apt-get update
          
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ccache git subversion curl xz-utils bzip2 patch \
            bison yasm tcl autoconf automake m4 meson python3-mako patchelf gettext autopoint \
            pkg-config ninja-build xutils-dev xsltproc xmlto python3-docutils lld \
            libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libegl-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev linux-libc-dev libpulse-dev libasound2-dev libjack-dev libpipewire-0.3-dev \
            libtool libtool-bin autotools-dev uuid-dev libffi-dev \
            libgles-dev libgl1-mesa-dev libgl-dev libglu1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libinput-dev libevdev-dev libmtdev-dev libseat-dev \
            libvulkan-dev glslang-dev glslang-tools spirv-tools libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xkb-dev libxcb-keysyms1-dev \
            libsystemd-dev libpam0g-dev libjpeg-dev libpng-dev libwebp-dev libcairo2-dev libpango1.0-dev xwayland \
            libxt-dev libsm-dev libice-dev libxaw7-dev libxpm-dev libepoxy-dev \
            libxml2-dev libtinyxml2-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev \
            libbz2-dev liblzma-dev zlib1g-dev libxrender-dev libxft-dev libx11-xcb-dev \
            libxcb-dri3-dev libxcb-present-dev libxshmfence-dev libclang-dev \
            libc6-dev-armhf-cross linux-libc-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Pre-Downloaded Missing Archives 
        run: |
          mkdir -p build_deps/packages
          curl -L "https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz" -o build_deps/packages/glu-9.0.1.tar.xz
          curl -L "https://archive.mesa3d.org/mesa-23.3.0.tar.xz" -o build_deps/packages/mesa-23.3.0.tar.xz
          curl -L "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz" -o build_deps/packages/gmp-6.2.1.tar.xz

      - name: Target Compatibility Patches
        run: |
          cd blender
          
          if [ -f "build_files/build_environment/cmake/ispc.cmake" ]; then
             sed -i '/CMAKE_ARGS/a\    -DX86_ENABLED=OFF\n    -DWEBASSEMBLY_ENABLED=OFF' build_files/build_environment/cmake/ispc.cmake || true
          fi
          
          find build_files/cmake -type f -exec sed -i -E 's|-fuse-ld=gold|-fuse-ld=lld|g' {} +
          
          sed -i '1s|^|set(PLATFORM_CFLAGS "-Wno-implicit-function-declaration -Wno-builtin-macro-redefined -Wno-int-conversion -Wno-implicit-int -Wno-incompatible-function-pointer-types -fPIC ${PLATFORM_CFLAGS}")\n|' build_files/build_environment/cmake/options.cmake
          sed -i '1s|^|set(PLATFORM_CXXFLAGS "-Wno-changes-meaning -Wno-error=changes-meaning -fpermissive -fPIC ${PLATFORM_CXXFLAGS}")\n|' build_files/build_environment/cmake/options.cmake
          
          if [ -f "build_files/build_environment/cmake/gmp.cmake" ]; then
             sed -i 's/--disable-assembly/--disable-assembly --disable-fat/g' build_files/build_environment/cmake/gmp.cmake || true
          fi
          
          if [ -f "build_files/build_environment/cmake/gmmlib.cmake" ]; then
             sed -i '/CMAKE_ARGS/a\    -DRUN_TEST_SUITE=OFF\n    -DRUN_ULT=OFF' build_files/build_environment/cmake/gmmlib.cmake || true
          fi
          
          find build_files/build_environment/cmake -name "*.cmake" -exec sed -i -E 's|\$\{SOURCE_DIR\}/configure |\$\{SOURCE_DIR\}/configure --build=aarch64-unknown-linux-gnu |g' {} +
          find build_files/build_environment/cmake -name "*.cmake" -exec sed -i -E 's|\./configure |\./configure --build=aarch64-unknown-linux-gnu |g' {} +
          
          sed -i 's/--prefix=/--build=aarch64-unknown-linux-gnu --prefix=/g' build_files/build_environment/cmake/theora.cmake || true
          sed -i 's/--prefix=/--build=aarch64-unknown-linux-gnu --prefix=/g' build_files/build_environment/cmake/vorbis.cmake || true
          
          for configure_test_pkg in vorbis theora; do
            if [ -f "build_files/build_environment/cmake/${configure_test_pkg}.cmake" ]; then
               sed -i 's/--with-ogg/--disable-oggtest --with-ogg/g' build_files/build_environment/cmake/${configure_test_pkg}.cmake || true
            fi
          done

          for f in build_files/build_environment/cmake/*.cmake; do
            sed -i 's|-DCMAKE_C_COMPILER=.*dpcpp/bin/clang|-DCMAKE_C_COMPILER=gcc|g' "$f"
            sed -i 's|-DCMAKE_CXX_COMPILER=.*dpcpp/bin/clang++|-DCMAKE_CXX_COMPILER=g++|g' "$f"
            sed -i 's|-DCMAKE_C_COMPILER=.*dpcpp/bin/icx|-DCMAKE_C_COMPILER=gcc|g' "$f"
            sed -i 's|-DCMAKE_CXX_COMPILER=.*dpcpp/bin/icpx|-DCMAKE_CXX_COMPILER=g++|g' "$f"
            sed -i 's/-DEMBREE_SYCL_SUPPORT=ON/-DEMBREE_SYCL_SUPPORT=OFF/g' "$f"
            sed -i 's/-DOIDN_DEVICE_SYCL=ON/-DOIDN_DEVICE_SYCL=OFF/g' "$f"
            sed -i 's/-DOIDN_DEVICE_HIP=ON/-DOIDN_DEVICE_HIP=OFF/g' "$f"
            sed -i 's/-DOIDN_DEVICE_CUDA=ON/-DOIDN_DEVICE_CUDA=OFF/g' "$f"
          done
         
          for intel_gpu_only in ocloc igc intel_compute_runtime dpcpp level_zero sycl; do
             if [ -f "build_files/build_environment/cmake/${intel_gpu_only}.cmake" ]; then
                echo "add_custom_target(external_${intel_gpu_only})" > "build_files/build_environment/cmake/${intel_gpu_only}.cmake"
             fi
          done

          sed -i 's|file(STRINGS ${_openimageio_export} OIIO_VERSION_DATA_LIST|#file|g' build_files/cmake/Modules/FindOpenImageIO.cmake || true
          sed -i 's|list(GET OIIO_VERSION_DATA_LIST 1 OIIO_VERSION)|set(OIIO_VERSION 2.4.0)|g' build_files/cmake/Modules/FindOpenImageIO.cmake || true
          
      - name: Fetch CCache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-aarch64-blender-4.2
          restore-keys: ccache-Linux-aarch64-blender-4.2-2-2026-09-30T18:54:54.969Z
          max-size: 4G
          create-symlink: true

      - name: Build Blender Dependencies
        run: |
          mkdir -p bin
          for cmd in aclocal autoconf automake autoheader libtoolize autoreconf automake-1.15 aclocal-1.15 automake-1.16 aclocal-1.16 autom4te; do
            echo '#!/bin/bash' > bin/$cmd
            echo 'if [[ "$PWD" == *"sqlite"* ]] || [[ "$PWD" == *"glu"* ]] || [[ "$PWD" == *"libglu"* ]]; then' >> bin/$cmd
            echo '    exit 0' >> bin/$cmd
            echo 'else' >> bin/$cmd
            echo '    if [ -x "/usr/bin/$(basename $0)" ]; then' >> bin/$cmd
            echo '        exec "/usr/bin/$(basename $0)" "$@"' >> bin/$cmd
            echo '    else' >> bin/$cmd
            echo '        echo "Missing original $(basename $0)!"' >> bin/$cmd
            echo '        exit 127' >> bin/$cmd
            echo '    fi' >> bin/$cmd
            echo 'fi' >> bin/$cmd
            chmod +x bin/$cmd
          done
          
          export PATH="/usr/lib/ccache:$(pwd)/bin:$PATH"

          export ARCH_LIBDIR=${{ github.workspace }}/lib/linux_aarch64
          
          mkdir -p build_deps && cd build_deps
          mkdir -p $ARCH_LIBDIR
          
          export CXXFLAGS="-Wno-changes-meaning -fpermissive -fPIC"
          export CFLAGS="-fPIC -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-function-pointer-types"
          export CC=gcc 
          export CXX=g++
          
          export ISPC_EXTRA_ARGS="--target=neon --arch=aarch64"
          
          cmake ../blender/build_files/build_environment \
            -DHARVEST_TARGET=$ARCH_LIBDIR \
            -DCMAKE_INSTALL_PREFIX=$ARCH_LIBDIR \
            -DBUILD_DIR=$ARCH_LIBDIR \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_SYCL=OFF
            
          make -j$(nproc)
          
          if [ -d "Release" ] && [ "$(ls -A Release)" ]; then
             cp -ra Release/* $ARCH_LIBDIR/ || true
          fi

      - name: Upload Blender Dependencies Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-deps
          path: ${{ github.workspace }}/lib/linux_aarch64

      - name: Build Blender
        run: |
          mkdir -p build_blender && cd build_blender
          
          export PATH="/usr/lib/ccache:$PATH"
          export CC=gcc 
          export CXX=g++
          export ARCH_LIBDIR=${{ github.workspace }}/lib/linux_aarch64
          
          export CXXFLAGS="-Wno-changes-meaning -fpermissive -fPIC -fuse-ld=lld -Wl,--undefined-version"
          export CFLAGS="-fPIC -Wno-incompatible-function-pointer-types -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -fuse-ld=lld -Wl,--undefined-version"
          
          cat << 'EOF' >> ../blender/build_files/cmake/platform/platform_unix.cmake
          
          file(GLOB_RECURSE LOCAL_LIB_FILES "$ENV{ARCH_LIBDIR}/*.a")
          list(APPEND PLATFORM_LINKLIBS 
             "-Wl,--allow-multiple-definition"
             "-Wl,--undefined-version"
             "-Wl,--start-group" 
             ${LOCAL_LIB_FILES} 
             "-Wl,--end-group" 
             "-lpthread" "-lz" "-lstdc++" "-lm"
          )
          EOF
          
          cmake ../blender \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-fuse-ld=lld -Wl,--allow-multiple-definition -Wl,--undefined-version" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--undefined-version" \
            -DCMAKE_MODULE_LINKER_FLAGS="-fuse-ld=lld -Wl,--undefined-version" \
            -DOPENEXR_ROOT_DIR="$ARCH_LIBDIR/openexr" \
            -DIMATH_ROOT_DIR="$ARCH_LIBDIR/imath" \
            -DOPENIMAGEIO_ROOT_DIR="$ARCH_LIBDIR/openimageio" \
            -DOPENVDB_ROOT_DIR="$ARCH_LIBDIR/openvdb" \
            -DNANOVDB_ROOT_DIR="$ARCH_LIBDIR/nanovdb" \
            -DOSL_ROOT_DIR="$ARCH_LIBDIR/osl" \
            -DPTEX_ROOT_DIR="$ARCH_LIBDIR/ptex" \
            -DBLOSC_ROOT_DIR="$ARCH_LIBDIR/blosc" \
            -DOPENCOLORIO_ROOT_DIR="$ARCH_LIBDIR/opencolorio" \
            -DOPENIMAGEDENOISE_ROOT_DIR="$ARCH_LIBDIR/openimagedenoise" \
            -DLIBDIR=$ARCH_LIBDIR \
            -DCMAKE_PREFIX_PATH=$ARCH_LIBDIR \
            -DPYTHON_VERSION=3.11 \
            -DPYTHON_ROOT_DIR=$ARCH_LIBDIR/python \
            -DWITH_INSTALL_PORTABLE=ON \
            -DOPENEXR_INCLUDE_DIR="$ARCH_LIBDIR/openexr/include/OpenEXR" \
            -DIMATH_INCLUDE_DIR="$ARCH_LIBDIR/imath/include" \
            -DOPENIMAGEIO_INCLUDE_DIR="$ARCH_LIBDIR/openimageio/include" \
            -DOPENVDB_INCLUDE_DIR="$ARCH_LIBDIR/openvdb/include" \
            -DNANOVDB_INCLUDE_DIR="$ARCH_LIBDIR/nanovdb/include" \
            -DWITH_OPENVDB=ON \
            -DWITH_NANOVDB=ON \
            -DWITH_OPENCOLORIO=ON \
            -DWITH_OPENIMAGEDENOISE=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_DEVICE_CUDA=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF \
            -DWITH_CYCLES_DEVICE_SYCL=OFF
            
          make -j$(nproc)
          make install

      - name: Upload Blender Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64
          path: build_blender/bin/
