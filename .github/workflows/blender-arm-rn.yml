name: Native Build Blender 4.2 LTS (aarch64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BLENDER_BRANCH: v4.2.23
  BLENDER_VERSION: 4.2.23

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Blender Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: ${{ env.BLENDER_BRANCH }}
          path: blender
          submodules: recursive

      - name: Prepare Clean Native Server Repositories 
        run: |
          sudo apt-get update
          
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ccache git subversion curl xz-utils bzip2 patch \
            bison yasm tcl autoconf automake libtool m4 meson python3-mako patchelf gettext autopoint pkg-config \
            clang llvm lld libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libegl-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev linux-libc-dev

      - name: Bridge Pre-Downloaded Missing FTP Archives 
        run: |
          mkdir -p build_deps/packages
          curl -L "https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz" -o build_deps/packages/glu-9.0.1.tar.xz
          curl -L "https://archive.mesa3d.org/mesa-23.3.0.tar.xz" -o build_deps/packages/mesa-23.3.0.tar.xz
          curl -L "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz" -o build_deps/packages/gmp-6.2.1.tar.xz

      - name: Target Native Compatibility Hot-Fixes
        run: |
          cd blender
          sed -i '1s|^|set(PLATFORM_CFLAGS "-Wno-implicit-function-declaration -Wno-int-conversion -Wno-implicit-int -Wno-incompatible-function-pointer-types -fPIC ${PLATFORM_CFLAGS}")\n|' build_files/build_environment/cmake/options.cmake
      
      - name: Prepare Global Compiler Accelerator State (CCACHE) 
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache
          restore-keys: ${{ runner.os }}-ccache
          max-size: 2G

      - name: Build Environment Dependencies (GCC + Unix Makefiles) 
        run: |
          mkdir -p build_deps && cd build_deps
          
          export CC=gcc CXX=g++
          
          cmake ../blender/build_files/build_environment \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_OPENVDB=OFF \
            -DBUILD_EMBREE=OFF \
            -DBUILD_OSL=OFF \
            -DBUILD_OIDN=OFF \
            -DBUILD_USD=OFF \
            -DBUILD_ALEMBIC=OFF \
            -DBUILD_MATERIALX=OFF

          make -j$(nproc)

      - name: Build Target Blender Binary (Clang + Unix Makefiles) 
        run: |
          mkdir -p build_blender && cd build_blender
          
          export CC=clang CXX=clang++
          
          cmake ../blender \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="../build_deps/opt" \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_DEVICE_CUDA=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF \
            -DWITH_CYCLES_DEVICE_SYCL=OFF \
            -DWITH_CYCLES_EMBREE=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_NANOVDB=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_USD=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_MATERIALX=OFF
            
          make -j$(nproc)
          make install

      - name: Dispatch Clean Executable Software Portable Deployment Zip Payload  
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-app
          path: build_blender/bin/

      - name: Provide Completed Cross Dependency Reference Outputs Source Structure  
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-deps
          path: |
            build_deps/linux*
            build_deps/opt
