name: Native Build Blender 4.2 LTS (aarch64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BLENDER_BRANCH: v4.2.23
  BLENDER_VERSION: 4.2.23

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Blender Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: ${{ env.BLENDER_BRANCH }}
          path: blender
          submodules: recursive

      - name: Install Pure Native Requirements
        run: |
          sudo apt-get update
          
          # Autotools suite explicitly downloaded to prevent Autogen crashes internally on older deps (like flex!)
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache git subversion curl xz-utils bzip2 patch \
            bison yasm tcl autoconf automake libtool autopoint m4 meson python3-mako patchelf gettext pkg-config \
            clang llvm lld libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libegl-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev linux-libc-dev 

      - name: Prepare Global Cached Directory Environment
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache-clang
          restore-keys: ${{ runner.os }}-ccache-clang
          max-size: 2G

      - name: Bridge Abandoned Networking Components  
        run: |
          mkdir -p build_deps/packages
          curl -L "https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz" -o build_deps/packages/glu-9.0.1.tar.xz
          curl -L "https://archive.mesa3d.org/mesa-23.3.0.tar.xz" -o build_deps/packages/mesa-23.3.0.tar.xz
          curl -L "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz" -o build_deps/packages/gmp-6.2.1.tar.xz

      - name: Patch Configuration Errors Locally via Sed Replacements 
        run: |
          cd blender
          
          # SQLite: Force Re-Configuration to wipe old internal dependencies against global Runner toolset 
          # Guaranteed 100% resolve against the Autotools version mismatch crashing SQLite (while preserving Flex functions)
          sed -i 's|\${SRC_DIR}/configure|autoreconf -fiv \${SRC_DIR} \&\& \${SRC_DIR}/configure|g' build_files/build_environment/cmake/sqlite.cmake
          
      - name: Launch Build Environments Execution Sandbox (Target - Libs) 
        run: |
          mkdir -p build_deps && cd build_deps
          
          export CC=clang CXX=clang++ 
          
          # Directly feed native paths. Any subsequent internal GCC execution perfectly re-aligns automatically alongside ninja!
          cmake ../blender/build_files/build_environment -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_OPENVDB=OFF \
            -DBUILD_EMBREE=OFF \
            -DBUILD_OSL=OFF \
            -DBUILD_OIDN=OFF \
            -DBUILD_USD=OFF \
            -DBUILD_ALEMBIC=OFF \
            -DBUILD_MATERIALX=OFF
            
          ninja -j$(nproc)

      - name: Build Core Output Applications Array Sandbox (Target - Final GUI Application Build)
        run: |
          mkdir -p build_blender && cd build_blender
          
          export CC=clang CXX=clang++
          
          cmake ../blender -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="../build_deps/opt" \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_DEVICE_CUDA=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF \
            -DWITH_CYCLES_DEVICE_SYCL=OFF \
            -DWITH_CYCLES_EMBREE=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_NANOVDB=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_USD=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_MATERIALX=OFF
            
          ninja -j$(nproc)
          ninja install

      - name: Package Extracted Client Software ZIP Output  
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-app
          path: build_blender/bin/

      - name: Output Environment Source Configuration Output Dependencies ZIP Array
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-deps
          path: build_deps/
