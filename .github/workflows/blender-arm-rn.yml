name: Native Build Blender 4.2 LTS (aarch64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BLENDER_BRANCH: v4.2.23
  BLENDER_VERSION: 4.2.23

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Blender Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: ${{ env.BLENDER_BRANCH }}
          path: blender
          submodules: recursive

      - name: Install System Build Toolkits
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache git subversion curl xz-utils bzip2 patch \
            bison yasm tcl autoconf automake meson python3-mako patchelf gettext pkg-config \
            clang llvm lld libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libegl-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev linux-libc-dev

      - name: Construct Unbreakable Compiler Intercepts
        run: |
          # Intercept rigid legacy makefiles entirely bypassing CMake parameters
          mkdir -p $HOME/toolchain-intercept
          
          # 1. Force Make-called Clang tasks to universally swallow legacy C99 compatibility flags
          cat << 'EOF' > $HOME/toolchain-intercept/clang
          #!/bin/bash
          exec /usr/bin/clang -Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-error=incompatible-function-pointer-types "$@"
          EOF
          
          cat << 'EOF' > $HOME/toolchain-intercept/clang++
          #!/bin/bash
          exec /usr/bin/clang++ -Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-error=incompatible-function-pointer-types "$@"
          EOF
          
          chmod +x $HOME/toolchain-intercept/clang $HOME/toolchain-intercept/clang++
          
          # 2. Seamlessly re-route raw GCC requests down to the strict C99 patched proxy script above 
          ln -s $HOME/toolchain-intercept/clang $HOME/toolchain-intercept/gcc
          ln -s $HOME/toolchain-intercept/clang $HOME/toolchain-intercept/cc
          ln -s $HOME/toolchain-intercept/clang++ $HOME/toolchain-intercept/g++
          ln -s $HOME/toolchain-intercept/clang++ $HOME/toolchain-intercept/c++
          
          # 3. Suppress all libtool mismatch regressions by simulating successful executions for timestamp builds 
          ln -s /usr/bin/true $HOME/toolchain-intercept/aclocal
          ln -s /usr/bin/true $HOME/toolchain-intercept/aclocal-1.16
          ln -s /usr/bin/true $HOME/toolchain-intercept/autoconf
          ln -s /usr/bin/true $HOME/toolchain-intercept/automake
          ln -s /usr/bin/true $HOME/toolchain-intercept/automake-1.16
          ln -s /usr/bin/true $HOME/toolchain-intercept/autoheader
          ln -s /usr/bin/true $HOME/toolchain-intercept/libtoolize
          
          # Prepend Sandbox as global priority #1 on GitHub Environment Engine 
          echo "$HOME/toolchain-intercept" >> $GITHUB_PATH

      - name: Setup Global Build Cache Context
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache-
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 2G

      - name: Refresh Disabled FTP Dependency Endpoints 
        run: |
          mkdir -p build_deps/packages
          curl -L "https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz" -o build_deps/packages/glu-9.0.1.tar.xz
          curl -L "https://archive.mesa3d.org/mesa-23.3.0.tar.xz" -o build_deps/packages/mesa-23.3.0.tar.xz
          curl -L "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz" -o build_deps/packages/gmp-6.2.1.tar.xz
         
      - name: Compiling Standalone Dependency Environment (Ninja + Native)
        run: |
          cd build_deps
          
          export AUTOCONF=true AUTOMAKE=true ACLOCAL=true AUTOHEADER=true MAKEINFO=true
          export CC=clang CXX=clang++ 
          
          cmake ../blender/build_files/build_environment -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_OPENVDB=OFF \
            -DBUILD_EMBREE=OFF \
            -DBUILD_OSL=OFF \
            -DBUILD_OIDN=OFF \
            -DBUILD_USD=OFF \
            -DBUILD_ALEMBIC=OFF \
            -DBUILD_MATERIALX=OFF
            
          ninja -j$(nproc)

      - name: Construct Standalone Target Client (Ninja + Native)
        run: |
          mkdir -p build_blender && cd build_blender
          
          export CC=clang CXX=clang++
          
          cmake ../blender -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="../build_deps/opt" \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_DEVICE_CUDA=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF \
            -DWITH_CYCLES_DEVICE_SYCL=OFF \
            -DWITH_CYCLES_EMBREE=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_NANOVDB=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_USD=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_MATERIALX=OFF
            
          ninja -j$(nproc)
          ninja install

      - name: Dispatch Render Artifact Binary Target 
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-app
          path: build_blender/bin/

      - name: Dispatch Toolchain Dependencies Base 
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-deps
          path: build_deps/
