name: Native Build Blender 4.2 LTS (aarch64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  BLENDER_BRANCH: v4.2.23
  BLENDER_VERSION: 4.2.23

jobs:
  build-native:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Blender Repository
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: ${{ env.BLENDER_BRANCH }}
          path: blender
          submodules: recursive

      - name: Prepare Clean Native Server Repositories 
        run: |
          sudo apt-get update
          
          # Native requirements array carefully expanded to fulfill 'flex', 'sqlite', and GUI libraries 
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache git subversion curl xz-utils bzip2 patch \
            bison yasm tcl autoconf automake libtool m4 meson python3-mako patchelf gettext autopoint pkg-config \
            clang llvm lld libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxinerama-dev libegl-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libdbus-1-dev linux-libc-dev

      - name: Bridge Pre-Downloaded Missing FTP Archives 
        run: |
          mkdir -p build_deps/packages
          curl -L "https://archive.mesa3d.org/glu/glu-9.0.1.tar.xz" -o build_deps/packages/glu-9.0.1.tar.xz
          curl -L "https://archive.mesa3d.org/mesa-23.3.0.tar.xz" -o build_deps/packages/mesa-23.3.0.tar.xz
          curl -L "https://ftp.gnu.org/gnu/gmp/gmp-6.2.1.tar.xz" -o build_deps/packages/gmp-6.2.1.tar.xz

      - name: Target Native Compatibility Hot-Fixes
        run: |
          cd blender
          
          # 1. SQLite: Automatically synchronize and overwrite local older libtool version mismatched autotools inside the src zip
          sed -i 's|cd \${BUILD_DIR} \&\& \${SRC_DIR}/configure|cd \${BUILD_DIR} \&\& autoreconf -fiv \${SRC_DIR} \&\& \${SRC_DIR}/configure|' build_files/build_environment/cmake/sqlite.cmake
          
          # 2. OpenSSL: Block runner OS interpretation and force explicit cross compiling parameters within Configure line dynamically
          sed -i 's|\./config|\./Configure linux-aarch64 CC=clang|g' build_files/build_environment/cmake/ssl.cmake
          
          # 3. LibFFI: Dynamically append loose C-language flag instructions into external make systems strictly internally preventing 'tramp' build restrictions!
          sed -i 's|\${SRC_DIR}/configure|\${SRC_DIR}/configure CFLAGS="-Wno-implicit-function-declaration -Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-implicit-int -fPIC" |g' build_files/build_environment/cmake/ffi.cmake

      - name: Prepare Global Ninja Accelerator State (CCACHE) 
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ runner.os }}-ccache-blender
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 2G

      - name: Native Sandbox Architecture Render Libraries Execute (aarch64) 
        run: |
          mkdir -p build_deps && cd build_deps
          
          # Enact Clang compilation suite globally and feed legacy Makefiles universally-inherited tolerant GNU attributes smoothly
          export CC=clang CXX=clang++ 
          export CFLAGS="-Wno-implicit-function-declaration -Wno-incompatible-function-pointer-types -Wno-int-conversion -Wno-implicit-int -fPIC"
          export CXXFLAGS="$CFLAGS -std=c++17"
          
          cmake ../blender/build_files/build_environment -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_OPENVDB=OFF \
            -DBUILD_EMBREE=OFF \
            -DBUILD_OSL=OFF \
            -DBUILD_OIDN=OFF \
            -DBUILD_USD=OFF \
            -DBUILD_ALEMBIC=OFF \
            -DBUILD_MATERIALX=OFF
            
          ninja -j$(nproc)

      - name: Output Blender Standard Framework Runtime Client Execution 
        run: |
          mkdir -p build_blender && cd build_blender
          
          export CC=clang CXX=clang++
          
          # Pull safely completed local Linux library path maps effortlessly via build_deps 
          cmake ../blender -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="../build_deps/opt" \
            -DWITH_INSTALL_PORTABLE=ON \
            -DWITH_CYCLES=ON \
            -DWITH_CYCLES_DEVICE_CUDA=OFF \
            -DWITH_CYCLES_DEVICE_OPTIX=OFF \
            -DWITH_CYCLES_DEVICE_HIP=OFF \
            -DWITH_CYCLES_DEVICE_SYCL=OFF \
            -DWITH_CYCLES_EMBREE=OFF \
            -DWITH_CYCLES_OSL=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_NANOVDB=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_USD=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_MATERIALX=OFF
            
          ninja -j$(nproc)
          ninja install

      - name: Dispatch Clean Executable Software Portable Deployment Zip Payload  
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-app
          path: build_blender/bin/

      - name: Provide Completed Cross Dependency Reference Outputs Source Structure  
        uses: actions/upload-artifact@v4
        with:
          name: blender-4.2.23-aarch64-deps
          path: build_deps/
